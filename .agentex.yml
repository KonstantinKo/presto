# Agentex Configuration

version: 1

# Workflow settings
workflow:
  type: plan_and_build
  model: sonnet

# Labels to skip (issues with these labels won't be processed)
skip_labels:
  - wontfix
  - discussion
  - question

# Custom prompts
prompts:
  planning_addon: ""

# QA verification commands
# Each section runs in sequence; format commands declare an autofix.
qa:
  setup:
    # Phase 0 baseline (spec 001-leptos-migration T008): workspace-frozen
    # fetch validates the repo-root Cargo.lock before any `cargo build`
    # downstream tries to mutate it. The scoped `(cd tests/e2e && npm ci)`
    # line lands in Phase 6 once tests/e2e/package.json exists; the
    # repo-root `npm ci` stays for the transition so the legacy JS app
    # still builds.
    - cargo fetch --locked
    - npm ci

  test:
    - cd src-tauri && cargo build --all-targets
    - cd src-tauri && cargo test
    - npm test

  lint:
    - cd src-tauri && cargo clippy --all-targets -- -D warnings
    - npx eslint "src/**/*.{js,mjs,cjs}" "tests/**/*.{js,mjs,cjs}" "*.js" "*.mjs" "*.cjs" --no-error-on-unmatched-pattern
    - npx tsc --noEmit -p .
    # Mock drift gate (spec 001-leptos-migration T021): every #[tauri::command]
    # handler in src-tauri/src/lib.rs must have a matching `case "<name>":` in
    # tests/e2e/fixtures/tauriMock.js, and vice versa. Phase-6 deletions and
    # plugin-injected commands are exempt. See scripts/check-mock-drift.sh
    # header for the full exemption list.
    - bash scripts/check-mock-drift.sh

  format:
    - command: cd src-tauri && cargo fmt -- --check
      autofix: cd src-tauri && cargo fmt
    - command: npx prettier --check .
      autofix: npx prettier --write .

# Claude Code slash commands are available in .claude/commands/
