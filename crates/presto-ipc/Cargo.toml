[package]
name = "presto-ipc"
version = "0.4.4"
description = "Shared wire-type definitions for the presto Tauri↔Leptos IPC boundary"
authors = ["Konstantin Koss"]
edition = "2021"
publish = false

[lints]
workspace = true

[features]
default = []
# `specta` enables `specta::Type` derives so `tauri-specta` can codegen
# bindings. Host (Tauri) crate enables; WASM (Leptos) crate disables so
# specta's transitives don't enter the wasm dep graph.
specta = ["dep:specta"]

[dependencies]
serde = { version = "1", features = ["derive", "std"], default-features = false }
serde_json = { version = "1", default-features = false, features = ["std"] }
chrono = { version = "0.4", features = ["serde", "clock"], default-features = false }
thiserror = "1"
specta = { version = "=2.0.0-rc.22", optional = true, default-features = false, features = ["derive", "serde_json", "chrono"] }
