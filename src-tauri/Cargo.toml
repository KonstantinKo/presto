[package]
name = "presto"
version = "0.4.4"
description = "A Pomodoro timer app built with Tauri"
authors = ["Stefano Novelli"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lints]
workspace = true

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "presto_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Build profiles moved to the workspace root Cargo.toml. Per Cargo,
# `[profile.*]` in non-root members is silently ignored when the package
# is part of a workspace.

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
log = "0.4"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-opener = { version = "2", default-features = false }
tauri-plugin-global-shortcut = { version = "2", default-features = false }
tauri-plugin-dialog = { version = "2", default-features = false }
tauri-plugin-notification = { version = "2", default-features = false }
tauri-plugin-autostart = { version = "2", default-features = false }
tauri-plugin-updater = { version = "2", default-features = false }
tauri-plugin-process = { version = "2", default-features = false }
tauri-plugin-oauth = { git = "https://github.com/FabianLars/tauri-plugin-oauth", rev = "f941c99c3ed528a55db7fe05c931480a8255041d" }
tauri-plugin-aptabase = "1.0.0"
serde = { version = "1", features = ["derive"], default-features = false }
serde_json = { version = "1", default-features = false }
chrono = { version = "0.4", features = ["serde", "clock"], default-features = false }
base64 = "0.21"
# `thiserror` powers the `BridgeError` mirror enum (spec
# 001-leptos-migration T025; mirrors `presto-web` Cargo.toml).
thiserror = "1"
# `reqwest` powers the Supabase REST adapter introduced in Phase 1D
# T088-T095. Per research.md §6, we deliberately reject the supabase-rs
# SDK in favour of direct REST + JWT against the four `/auth/v1/*`
# endpoints. `rustls-tls` + `default-features = false` skip the
# native-tls path so we don't drag OpenSSL onto Linux/macOS targets.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# `rust_xlsxwriter` powers the export_sessions_xlsx command introduced
# in Phase 1D T097-T098. Per research.md §8, write-only is sufficient
# (we never read xlsx files); chosen over umya-spreadsheet for its
# smaller binary size.
rust_xlsxwriter = "0.79"

[dev-dependencies]
tempfile = "3"
tauri = { version = "2", features = ["test"] }

[target.'cfg(debug_assertions)'.dependencies]
tauri = { version = "2", features = ["devtools"] }

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.25"
objc = "0.2"

