[package]
name = "presto"
version = "0.4.4"
description = "A Pomodoro timer app built with Tauri"
authors = ["Stefano Novelli"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lints]
workspace = true

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "presto_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Build profiles moved to the workspace root Cargo.toml. Per Cargo,
# `[profile.*]` in non-root members is silently ignored when the package
# is part of a workspace.

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Shared wire-type crate. `specta` feature enables `specta::Type`
# derives so `tauri-specta` can codegen TS bindings.
presto-ipc = { path = "../crates/presto-ipc", features = ["specta"] }
# `specta` + `tauri-specta` codegen TypeScript bindings from every
# `#[tauri::command]` + `specta::Type` derive. The exported file at
# `src/bindings/tauri.ts` is checked in; a `cargo test` gate
# (`tests/bindings_export.rs`) fails CI when it drifts. Defends the
# IPC boundary against the snake_case-vs-camelCase silent-rejection
# bug class.
specta = { version = "=2.0.0-rc.22", features = ["derive", "chrono", "serde_json"] }
tauri-specta = { version = "=2.0.0-rc.21", features = ["derive", "typescript"] }
specta-typescript = "=0.0.9"
log = "0.4"
# `devtools` ships in release: desktop users can attach the webview inspector
# to diagnose issues without a special debug build.
tauri = { version = "2", features = ["tray-icon", "devtools"] }
tauri-plugin-log = "2"
tauri-plugin-opener = { version = "2", default-features = false }
tauri-plugin-global-shortcut = { version = "2", default-features = false }
tauri-plugin-dialog = { version = "2", default-features = false }
tauri-plugin-notification = { version = "2", default-features = false }
tauri-plugin-autostart = { version = "2", default-features = false }
tauri-plugin-updater = { version = "2", default-features = false }
tauri-plugin-process = { version = "2", default-features = false }
serde = { version = "1", features = ["derive"], default-features = false }
serde_json = { version = "1", default-features = false }
chrono = { version = "0.4", features = ["serde", "clock"], default-features = false }
base64 = "0.21"
# `thiserror` powers the `BridgeError` mirror enum.
thiserror = "1"
# `rust_xlsxwriter` powers the export_sessions_xlsx command. Write-only
# is sufficient (we never read xlsx files); chosen over
# umya-spreadsheet for its smaller binary size.
rust_xlsxwriter = "0.79"

[dev-dependencies]
tempfile = "3"
tauri = { version = "2", features = ["test"] }

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.25"
objc = "0.2"


