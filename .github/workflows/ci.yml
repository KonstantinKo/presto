name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # baseline-cap and lockfile-drift gates diff against origin/main;
          # need the full history to resolve the merge base.
          fetch-depth: 0

      - name: Install Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          # Workspace root cache; covers src/, src-tauri/, tools/build-themes/.
          workspaces: ". -> target"

      - name: Cargo fetch (frozen)
        run: cargo fetch --locked

      - name: Cargo build (workspace, frozen)
        run: cargo build --workspace --frozen --all-targets

      - name: Cargo test (workspace, frozen)
        run: cargo test --workspace --frozen

      - name: Cargo clippy (pedantic-deny)
        run: cargo clippy --workspace --all-targets --frozen -- -D warnings -W clippy::pedantic

      - name: Cargo fmt check
        run: cargo fmt --all -- --check

      - name: Mock drift gate
        run: bash scripts/check-mock-drift.sh

      - name: Engine purity gate (Principle I)
        run: bash scripts/check-engine-purity.sh

      - name: Baseline-cap gate (Principle IV)
        # Skip on push-to-main itself (no PR diff to evaluate).
        if: github.event_name == 'pull_request' || github.ref != 'refs/heads/main'
        env:
          BASELINE_BASE_REF: origin/${{ github.base_ref || 'main' }}
        run: bash scripts/check-baseline-cap.sh

      - name: Lockfile-drift gate (Principle IX)
        if: github.event_name == 'pull_request' || github.ref != 'refs/heads/main'
        env:
          LOCKFILE_BASE_REF: origin/${{ github.base_ref || 'main' }}
        run: bash scripts/check-lockfile-drift.sh

  e2e:
    runs-on: ubuntu-latest
    needs: rust
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install trunk
        uses: jetli/trunk-action@v0.5.0
        with:
          version: "latest"

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: tests/e2e/package-lock.json

      - name: Install e2e dependencies
        run: npm ci
        working-directory: tests/e2e

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('tests/e2e/package-lock.json') }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: tests/e2e

      - name: Run e2e + visual-regression suite
        run: npx playwright test
        working-directory: tests/e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/e2e/playwright-report/
          retention-days: 7

      - name: Upload Playwright test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: tests/e2e/test-results/
          retention-days: 7
          if-no-files-found: ignore
