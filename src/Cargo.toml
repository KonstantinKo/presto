[package]
name = "presto-web"
version = "0.4.4"
description = "Leptos (CSR + WASM) frontend for the presto pomodoro timer"
authors = ["Konstantin Koss"]
edition = "2021"
publish = false

[[bin]]
name = "presto-web"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
# Shared wire-type crate. No specta feature — the WASM target must
# never pull specta's transitives.
presto-ipc = { path = "../crates/presto-ipc" }
leptos = { version = "0.7", features = ["csr"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
console_error_panic_hook = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-wasm-bindgen = "0.6"
gloo-storage = "0.3"
thiserror = "1"
chrono = { version = "0.4", features = ["alloc", "serde", "wasmbind"], default-features = false }
leptos_i18n = { version = "=0.5.11", default-features = false, features = ["csr", "json_files", "icu_compiled_data", "interpolate_display"] }

[dependencies.web-sys]
version = "0.3"
features = [
    "Window",
    "Document",
    "Element",
    "HtmlElement",
    "Node",
    # `EventTarget` + `MouseEvent` power the document-level close-on-
    # outside-click listener for the tag-dropdown popover in
    # `components::timer`. Mirrors the JS-era
    # `document.addEventListener("click", ...)` at the deleted
    # `src/managers/tag-manager.js` that closed the popover when the
    # user clicked outside `#timer-status` / `#tag-dropdown-menu`.
    "EventTarget",
    "MouseEvent",
    # `KeyboardEvent` powers the document-level start/stop keyboard
    # shortcut listener for the tag-dropdown popover in
    # `components::timer`. Mirrors the JS-era
    # `pomodoro-timer.js:setupKeyboardShortcuts` Space-key fallback
    # exercised by `settings-shortcuts.spec.js`.
    "KeyboardEvent",
    # `MediaQueryList` powers `theme::loader::system_prefers_dark`
    # (Phase 5 T224 — follow-system-theme via the
    # `prefers-color-scheme: dark` media query). Mirrors the JS-era
    # `window.matchMedia(...).matches` read in the now-deleted
    # `src/managers/theme-manager.js` (removed in Phase 6 T238).
    "MediaQueryList",
    # Audio features for the `play_chime` helper in `components::timer`.
    # Port of the JS-era `playNotificationSound` oscillator (800 Hz sine,
    # 0.5 s exponential decay) gated on `Settings.notifications.sound_notifications`.
    "AudioContext",
    # `AudioContextState` allows reading `.state()` on the cached context.
    # Used in `prime_audio_context` to skip `.resume()` when already running,
    # avoiding a spurious promise allocation on every Start click.
    "AudioContextState",
    "OscillatorType",
    "GainNode",
    "OscillatorNode",
    "AudioNode",
    "AudioParam",
    "AudioDestinationNode",
    # Feature 004 (T003): looping `<audio>` element + its parent
    # `HtmlMediaElement` for the ambient-sound driver
    # (`components::ambient_audio`). The driver wraps a pair of
    # persistent `HtmlAudioElement` instances and ramps their
    # `.volume` via `HtmlMediaElement.set_volume` during fades and
    # cross-fades. Reuses the existing `web-sys` crate; no new
    # dependency line, no `Cargo.lock` mutation.
    "HtmlAudioElement",
    "HtmlMediaElement",
    # `window.crypto.randomUUID()` powers collision-free tag id
    # generation in `components::timer::random_uuid`. Mirrors the
    # JS-era `crypto.randomUUID()` at `tag-manager.js:287`.
    "Crypto",
]

[dev-dependencies]
wasm-bindgen-test = "0.3"

# Feature 005: leptos_i18n proc-macro reads `<crate-root>/locales/<locale>.json`
# at compile time and embeds the catalogues into the WASM bundle. No runtime
# fetch, no on-disk catalogue outside the WASM binary (Spec FR-008 / FR-019).
[package.metadata.leptos-i18n]
default = "en"
locales = ["en", "de", "it", "tr"]
