[package]
name = "presto-web"
version = "0.4.4"
description = "Leptos (CSR + WASM) frontend for the presto pomodoro timer"
authors = ["Konstantin Koss"]
edition = "2021"
publish = false

[[bin]]
name = "presto-web"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
leptos = { version = "0.7", features = ["csr"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
console_error_panic_hook = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-wasm-bindgen = "0.6"
gloo-storage = "0.3"
thiserror = "1"
chrono = { version = "0.4", features = ["serde", "wasmbind"], default-features = false }

[dependencies.web-sys]
version = "0.3"
features = [
    "Window",
    "Document",
    "Element",
    "HtmlElement",
]

[dev-dependencies]
wasm-bindgen-test = "0.3"
