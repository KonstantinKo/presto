# Trunk configuration for the presto-web Leptos crate.
# Per spec 001-leptos-migration research.md §1.

[build]
target = "index.html"
# `dist` is Trunk's default; declared explicitly so tauri.conf.json
# `frontendDist = "../src/dist"` is unambiguous.
dist = "dist"
# wasm-opt is disabled per `data-wasm-opt="0"` on the Rust link tag in
# index.html (the system binaryen <= 126 rejects rustc 1.95+ wasm output;
# Trunk's auto-downloaded binaryen 116 has no arm64 archive). Re-enable
# once the toolchain catches up.

[serve]
addresses = ["127.0.0.1"]
port = 1420

[watch]
# Only watch source paths the Leptos crate cares about. `style/` and
# `assets/` will be populated in Phase 5; harmless to list now.
watch = ["src", "style", "assets", "index.html", "Trunk.toml"]
# `src/theme/themes.rs` is regenerated by the `presto-build-themes`
# pre-build hook on every Trunk build. Without this ignore, Trunk's
# watcher sees the rewrite, fires another build, the hook writes the
# same file again, and the loop never settles — the dev window flickers
# as Tauri's live-reload reconnects each cycle.
ignore = ["src/theme/themes.rs"]

# Theme code-gen runs before every build. Phase 0 emits a one-line
# placeholder (see tools/build-themes/src/main.rs); the real generator
# lands in Phase 5.
[[hooks]]
stage = "pre_build"
command = "cargo"
command_arguments = ["run", "-p", "presto-build-themes"]

# Phase 4e R-001: Trunk emits an inline `<script type="module">` whose
# sha-384 hash drifts on every build (the body embeds the wasm-bindgen
# JS filename which itself carries a content hash). The production CSP
# at `src-tauri/tauri.conf.json` cannot pin a stable hash for that
# inline script, so this post-build hook extracts the inline script
# into `dist/boot.js` and rewrites the HTML to load it via a `src=`
# reference. With the script no longer inline, the production CSP can
# use `script-src 'self' 'wasm-unsafe-eval'` (the latter is required
# by every WASM-loading browser regardless of the script source).
[[hooks]]
stage = "post_build"
command = "cargo"
command_arguments = ["run", "-p", "presto-externalize-boot"]
