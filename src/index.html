<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Presto</title>
    <!-- Roboto Flex display font — referenced by style/timer.css and
         style/settings.css for timer digits and mode badge. CSP allows
         fonts.googleapis.com / fonts.gstatic.com. Blocked in the e2e
         test environment (_blockExternal fixture) so baselines won't
         drift from the font; production tauri dev loads it. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:wght@400;800&display=swap" rel="stylesheet" />
    <!-- data-wasm-opt="0" disables Trunk's wasm-opt step. The bundled
         binaryen on Fedora (<= 126) cannot validate wasm emitted by
         rustc 1.95+; flip back to default once the toolchain catches up. -->
    <link data-trunk rel="rust" data-wasm-opt="0" />
    <!-- Phase 5 (T222): vendor the remixicon font + CSS into the
         dist tree. `copy-dir` mirrors `assets/icons/` to
         `dist/assets/icons/` so the @font-face URLs in
         `remixicon.css` resolve at runtime. `data-target-path`
         preserves the `assets/icons/` two-level path; without it
         Trunk drops the source dir at the dist root using the
         leaf name only (`dist/icons/`). -->
    <link data-trunk rel="copy-dir" href="assets/icons" data-target-path="assets/icons" />
    <!-- Feature 004 (T002): vendor the ambient-sound MP3 tree
         same-origin. Mirrors `src/assets/audio/` (the `ambient/`
         subdirectory plus its README) into `dist/assets/audio/` so the
         seven `HtmlAudioElement.src = "/assets/audio/ambient/<track>.mp3"`
         lookups in `components::ambient_audio` resolve at runtime.
         No CDN — the `_blockExternal` fixture in the e2e suite must
         stay green (FR-017 / Principle II — Local-Only). -->
    <link data-trunk rel="copy-dir" href="assets/audio" data-target-path="assets/audio" />
    <link rel="stylesheet" href="/assets/icons/remixicon.css" />
    <!-- Feature 003 (T002): vendor the Phosphor regular-weight webfont
         same-origin. The `copy-dir` directive above already mirrors the
         whole `assets/icons/` tree (including `assets/icons/phosphor/`)
         into `dist/`; this second stylesheet link loads the Phosphor
         CSS so `.ph` / `.ph-*` class lookups bind to the font face.
         No CDN URL — _blockExternal fixture in the e2e suite must keep
         passing (FR-022 / Principle II). -->
    <link rel="stylesheet" href="/assets/icons/phosphor/phosphor.css" />
    <!-- Phase 6 (T241): wire the app stylesheet into the Trunk dist.
         `style/main.css` uses CSS `@import` to chain the per-component
         sheets — Trunk's `rel="css"` directive is a verbatim copy
         that does NOT inline the imports, so the browser must resolve
         them itself. We `copy-dir` the whole `style/` tree into
         `dist/style/` (preserving the relative paths the @imports
         use) and then load `style/main.css` via a plain
         `<link rel="stylesheet">` — the browser then fetches
         `style/variables.css`, `style/themes/espresso.css`, etc.
         relative to that, all of which are now reachable on the
         Trunk dev server. -->
    <link data-trunk rel="copy-dir" href="style" data-target-path="style" />
    <link rel="stylesheet" href="/style/main.css" />
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
