<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Presto</title>
    <!-- data-wasm-opt="0" disables Trunk's wasm-opt step. The bundled
         binaryen on Fedora (<= 126) cannot validate wasm emitted by
         rustc 1.95+; flip back to default once the toolchain catches up. -->
    <link data-trunk rel="rust" data-wasm-opt="0" />
    <!-- Phase 5 (T222): vendor the remixicon font + CSS into the
         dist tree. `copy-dir` mirrors `assets/icons/` to
         `dist/assets/icons/` so the @font-face URLs in
         `remixicon.css` resolve at runtime. `data-target-path`
         preserves the `assets/icons/` two-level path; without it
         Trunk drops the source dir at the dist root using the
         leaf name only (`dist/icons/`). -->
    <link data-trunk rel="copy-dir" href="assets/icons" data-target-path="assets/icons" />
    <link rel="stylesheet" href="/assets/icons/remixicon.css" />
    <!-- Phase 6 (T241): wire the app stylesheet into the Trunk dist.
         `style/main.css` uses CSS `@import` to chain the per-component
         sheets — Trunk's `rel="css"` directive is a verbatim copy
         that does NOT inline the imports, so the browser must resolve
         them itself. We `copy-dir` the whole `style/` tree into
         `dist/style/` (preserving the relative paths the @imports
         use) and then load `style/main.css` via a plain
         `<link rel="stylesheet">` — the browser then fetches
         `style/variables.css`, `style/themes/espresso.css`, etc.
         relative to that, all of which are now reachable on the
         Trunk dev server. -->
    <link data-trunk rel="copy-dir" href="style" data-target-path="style" />
    <link rel="stylesheet" href="/style/main.css" />
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
